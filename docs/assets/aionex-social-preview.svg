<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">AIONEX: Your Personal AI Companions</title>
  <desc id="description">A dark original AIONEX banner with an orbital star graphic and project tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F2748"/>
      <stop offset="0.52" stop-color="#081323"/>
      <stop offset="1" stop-color="#160D2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="840" y1="150" x2="1130" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <path d="M0 520C210 390 360 620 630 480c260-135 385-40 650-180v340H0z" fill="#818CF8" opacity="0.07"/>
  <g transform="translate(830 105)">
    <circle cx="205" cy="215" r="84" fill="url(#accent)" opacity="0.2" filter="url(#glow)"/>
    <circle cx="205" cy="215" r="52" fill="url(#accent)"/>
    <path d="M72 232c28-82 128-137 219-108 53 17 76 54 53 86-31 46-127 68-211 44-58-17-87-53-65-88" fill="none" stroke="#E0F2FE" stroke-width="13" stroke-linecap="round"/>
    <path d="M154 71c61 26 104 101 104 181 0 56-23 99-61 91-54-11-87-92-80-172 4-51 25-85 54-92" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="342" cy="197" r="14" fill="#E0F2FE"/>
    <circle cx="151" cy="72" r="14" fill="#C4B5FD"/>
  </g>
  <text x="92" y="212" fill="#A5B4FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="9">BUILT BY AIONEX</text>
  <text x="88" y="310" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="78" font-weight="800">Your Personal</text>
  <text x="88" y="397" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="78" font-weight="800">AI Companions</text>
  <text x="94" y="475" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29">Five personas · streaming chat · local memory controls</text>
  <rect x="92" y="530" width="450" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
